<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mosaico</title>
  <style>
    :root{
      --azul:#132243; --amarillo:#F6BB00; --blanco:#FFFFFF;

      /* Grilla / tarjetas */
      --tile-gap: 12px;
      --tile-radius: 10px;
      --tile-shadow: 0 2px 10px rgba(0,0,0,.2);
      --tile-size: 120px;

      /* Colores de categorías (RGB) */
      --cat-PAIM: 0,218,220;
      --cat-PM:   0,213,102;
      --cat-SI:   177,178,177;
      --cat-TD:   245,183,30;
      --cat-otro: 255,255,255;
    }

    @media (min-width: 576px){ :root{ --tile-size: 140px; } }
    @media (min-width: 992px){ :root{ --tile-size: 180px; } }

    html,body{
      height:100%; margin:0; background: var(--azul); color: var(--blanco);
      font: 16px/1.5 system-ui, Segoe UI, Roboto, Helvetica, Arial;
    }

    body::before{
      content:""; position:fixed; inset:0; z-index:-2; background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.05) 0 35%, transparent 36%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,.05) 0 32%, transparent 33%),
      linear-gradient(135deg, #0e1a36 0%, #0b1530 40%, #0a122a 100%);
    }
    body::after{
      content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 2px, transparent 2px 6px),
      radial-gradient(closest-side, rgba(255,255,255,.06), transparent 70%) left 12% top 18%/280px 280px no-repeat,
      radial-gradient(closest-side, rgba(255,255,255,.06), transparent 70%) right 8% bottom 16%/220px 220px no-repeat;
      mix-blend-mode: overlay;
    }

    .band-left, .band-right{
      position:fixed; top:0; bottom:0; width:min(27vw, 360px); pointer-events:none;
    }
    .band-left{ left:0; background: linear-gradient(120deg, var(--amarillo) 0 6%, transparent 6%); opacity:.85; }
    .band-right{ right:0; background: linear-gradient(-120deg, var(--amarillo) 0 6%, transparent 6%); opacity:.85; }
    @media (max-width: 1200px){ .band-left, .band-right{ width: min(18vw, 220px); opacity:.65; } }
    @media (max-width: 992px){ .band-left, .band-right{ display:none; } }

    .page{
      min-height:100%;
      display:grid; grid-template-rows:auto auto 1fr auto;
      max-width: 1400px; margin: 0 auto;
    }

    header{
      padding: clamp(16px, 2.5vw, 28px) clamp(18px, 5vw, 56px);
      display:grid; grid-template-columns: 1fr auto;
      align-items:center; gap: clamp(12px, 2vw, 24px);
    }

    .brand{ display:flex; align-items:center; gap:14px; }
    .brand img{ width:56px; height:56px; object-fit:contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.35)); }
    .brand .name{ font-weight:800; letter-spacing:.3px; font-size: clamp(18px, 1.8vw, 26px); color: var(--amarillo); }

    .title-box{ text-align:right; margin-left:auto; }
    .title-box .line1{ font-size: clamp(14px,1.4vw,16px); opacity:.85 }
    .title-box .line2{ font-weight: 900; font-size: clamp(22px,2.6vw,38px); color: var(--amarillo); letter-spacing:.6px }
    .title-box .line3{ font-weight:600; font-size: clamp(14px,1.6vw,18px); opacity:.9 }

    @media (max-width: 768px){
      header{ grid-template-columns: 1fr; }
      .title-box{ text-align: left; margin-left: 0; }
    }

    /* Controles */
    .controls-wrap{ padding: 4px clamp(18px, 5vw, 56px) 0; }

    /* NUEVA BANDA AMARILLA */
    .program-banner{
      display:flex;
      justify-content:center;
      margin: 0 0 10px;
    }
    .program-label{
      background: var(--amarillo);
      color:#111;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.08em;
      padding:10px 40px;
      border-radius:999px;
      box-shadow:0 6px 18px rgba(0,0,0,.5);
      font-size:clamp(14px,1.6vw,18px);
      text-align:center;
    }

    .filters{
      display:flex; flex-wrap:wrap;
      gap: clamp(6px, 1vw, 10px);
      align-items:center; margin: 0 0 8px;
    }

    .filters .legend{
      display:flex;
      gap: 8px;
      row-gap: 6px;
      align-items:center;
      font-size:1rem;
      opacity:.95;
      margin-left:auto;
      flex-wrap:wrap;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:4px 10px;
      border-radius:999px;
      background: rgba(255,255,255,.08);
      cursor:pointer;
      border:1px solid rgba(255,255,255,.16);
      transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
      font-size:0.9rem;
    }

    .chip:hover{
      background: rgba(255,255,255,.16);
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0,0,0,.35);
    }

    .dot{
      width:12px;
      height:12px;
      border-radius:999px;
      display:inline-block;
    }

    @media (max-width: 768px){ .filters .legend{ margin-left: 0; } }

    .btn{
      border:1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06);
      color: var(--blanco); font-weight:700; letter-spacing:.2px;
      padding: clamp(6px, .9vw, 10px) clamp(10px, 1.2vw, 14px);
      border-radius:10px; cursor:pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,.25);
    }
    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.10); }
    .btn.active{ border-color: var(--amarillo); box-shadow: 0 0 0 3px rgba(246,187,0,.22); }

    .stage-wrap{ padding: 6px clamp(18px, 5vw, 56px) 28px; }
    .stage{
      border-radius: 20px; position: relative; overflow: hidden;
      border:1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 18px 38px rgba(0,0,0,.35);
      padding: clamp(12px,2vw,26px);
      display:grid; gap: clamp(12px,2vw,24px);
      grid-template-rows: auto 1fr;
    }

    .section-title{
      font-weight:800; letter-spacing:.4px; opacity:.95; margin:0 0 6px;
      display:flex; align-items:center; gap:10px;
    }
    .section-title::before{
      content:""; width:10px; height:10px; background: var(--amarillo);
      border-radius:2px; box-shadow: 0 0 0 4px rgba(246,187,0,.18);
    }

    /* GRILLA */
    .grid{
      display:grid;
      gap: var(--tile-gap);
      justify-content: center;
    }
    #gridStudents{
      grid-template-columns: repeat(auto-fill, minmax(var(--tile-size), var(--tile-size)));
    }

    .tile{
      position:relative; border-radius: var(--tile-radius); overflow:hidden;
      box-shadow: var(--tile-shadow); background:#0b1327; border:1px solid rgba(255,255,255,.06);
      aspect-ratio: 3 / 4; cursor:pointer; --tint-rgb: var(--cat-otro);
      content-visibility: auto; contain-intrinsic-size: 300px 400px;
      width: var(--tile-size);
    }
    .tile img, .tile video{ position:absolute; inset:0; width:100%; height:100%; object-fit: cover; display:block; }
    .tile img{ z-index: 1; image-rendering: auto; }
    .tile video{ z-index: 3; opacity:0; transition: opacity .18s ease; }
    .tile.playing video{ opacity:1; }

    .tile::after{
      content:""; position:absolute; inset:0; pointer-events:none; z-index:2;
      background: rgba(var(--tint-rgb), .2);
      transition: background .12s ease;
    }
    .tile.playing::after{ background: rgba(var(--tint-rgb), 0); }

    .tile .caption{
      position:absolute; left:0; right:0; bottom:0;
      padding:8px 10px;
      background:
        linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(10,16,32,.75) 42%, rgba(10,16,32,.92) 100%);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      color: var(--blanco);
      font-weight:800;
      letter-spacing:.2px;
      text-align:center;
      text-shadow: 0 2px 8px rgba(0,0,0,.75);
      z-index:4;
      line-height: 1.15;
      min-height: 2.4em;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      overflow: hidden;
      font-size: clamp(12px, 1.2vw, 14px);
    }

    @supports not (-webkit-line-clamp: 2){
      .tile .caption{ white-space: normal; }
    }

    @media (max-height: 540px) and (orientation: landscape){
      .tile{ aspect-ratio: 1 / 1; }
    }

    .hidden{ display:none !important; }

    /* ========= MODAL ========= */
    .modal{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,.45);
      opacity:0;
      pointer-events:none;
      transition: opacity .2s ease;
      z-index: 999;
    }
    .modal.show{
      opacity:1;
      pointer-events:auto;
    }
    .modal-dialog{
      background:#ffffff;
      color:#000000;
      border-radius:12px;
      padding:20px 26px 18px;
      max-width:480px;
      width: calc(100% - 40px);
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      text-align:center;
      border-top:6px solid transparent;
    }
    .modal-title{
      margin:0 0 10px;
      font-size:1.3rem;
      font-weight:700;
      color:#000000;
    }
    .modal-body{
      margin:0 0 18px;
      font-size:.95rem;
      line-height:1.5;
      color:#000000;
    }
    .modal-close-btn{
      border:none;
      padding:8px 20px;
      border-radius:999px;
      background:#ffffff;
      color:#000000;
      cursor:pointer;
      font-weight:600;
      font-size:.9rem;
      box-shadow:0 3px 8px rgba(0,0,0,.25);
    }
    .modal-close-btn:hover{
      filter:brightness(0.9);
    }
  </style>
</head>
<body>
  <div class="band-left"></div>
  <div class="band-right"></div>

  <div class="page">
    <header>
      <div class="brand">
        <img src="IMAGES/LOGO_UMNG.png" alt="Escudo / Logo" />
        <div class="name">Universidad Militar Nueva Granada</div>
      </div>
      <div class="title-box">
        <div class="line1">Promoción</div>
        <div class="line2">2025-II</div>
        <div class="line3">DISEÑO III</div>
      </div>
    </header>

    <!-- Controles -->
    <div class="controls-wrap">

      <!-- BANDA AMARILLA: INGENIERÍA EN MULTIMEDIA -->
      <div class="program-banner">
        <div class="program-label">INGENIERÍA EN MULTIMEDIA</div>
      </div>

      <div class="filters" role="toolbar" aria-label="Filtros de categoría">
        <button class="btn active" data-filter="todos">Todos</button>
        <button class="btn" data-filter="PAIM">PAIM</button>
        <button class="btn" data-filter="PM">PM</button>
        <button class="btn" data-filter="SI">SI</button>
        <button class="btn" data-filter="TD">TD</button>

        <!-- LEYENDA CLICABLE -->
        <div class="legend">
          <span class="chip" onclick="openLegendModal('PAIM')">
            <span class="dot" style="background:rgb(var(--cat-PAIM))"></span>
            Procesamiento y análisis de la información multimedia (PAIM)
          </span>
          <span class="chip" onclick="openLegendModal('PM')">
            <span class="dot" style="background:rgb(var(--cat-PM))"></span>
            Producción Multimedia (PM)
          </span>
          <span class="chip" onclick="openLegendModal('SI')">
            <span class="dot" style="background:rgb(var(--cat-SI))"></span>
            Sistemas Interactivos (SI)
          </span>
          <span class="chip" onclick="openLegendModal('TD')">
            <span class="dot" style="background:rgb(var(--cat-TD))"></span>
            Transformación Digital (TD)
          </span>
        </div>
      </div>
    </div>

    <div class="stage-wrap">
      <section class="stage">
        <h3 class="section-title">Estudiantes</h3>
        <div id="gridStudents" class="grid" aria-live="polite"></div>
      </section>
    </div>
  </div>

  <!-- MODAL -->
  <div id="legendModal" class="modal" aria-hidden="true">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="legendModalTitle">
      <h2 id="legendModalTitle" class="modal-title">Título</h2>
      <p id="legendModalBody" class="modal-body">Contenido</p>
      <button type="button" class="modal-close-btn" onclick="closeLegendModal()">Cerrar</button>
    </div>
  </div>

  <script>
    const CATEGORY_RULES = [
      { key: 'PAIM', prefix: 'paim_', rgbVar: '--cat-PAIM' },
      { key: 'PM',   prefix: 'pm_',   rgbVar: '--cat-PM'   },
      { key: 'SI',   prefix: 'si_',   rgbVar: '--cat-SI'   },
      { key: 'TD',   prefix: 'td_',   rgbVar: '--cat-TD'   }
    ];

    const STUDENTS = [
      { img: 'IMAGES/PM_luisa.jpeg',   video: 'VIDEOS/luisa2.mp4',   name: 'LUISA SÁNCHEZ',      href: 'Luisa.html' },
      { img: 'IMAGES/TD_catalina.jpg', video: 'VIDEOS/Cata2.mp4',    name: 'CATALINA RODRÍGUEZ', href: 'Catalina.html' },
      { img: 'IMAGES/PM_SOFIA.png',    video: 'VIDEOS/Sofia2.mp4',   name: 'SOFIA ÁLVAREZ',      href: 'Sofia.html' },
      { img: 'IMAGES/SI_Mp.jpg',       video: 'VIDEOS/Mapis2.mp4',   name: 'MARÍA PAULA DIAZ',   href: 'MariaPaula.html' },
      { img: 'IMAGES/PAIM_AS.png',     video: 'VIDEOS/Alejandro2.mp4', name:'ALEJANDRO SILVA',   href: 'Alejandro.html' },
      { img: 'IMAGES/PM_Karen.jpeg',   video: 'VIDEOS/karen2.mp4',   name: 'KAREN DÍAZ',         href: 'Karen.html' },
      { img: 'IMAGES/PM_Fabian.jpeg',  video: 'VIDEOS/Fabian2.mp4',    name: 'FABIAN GONZALES',    href: 'Fabian.html' },
      { img: 'IMAGES/SI_Ana.jpg',       video: 'VIDEOS/Ana.mp4',        name: 'ANA MARÍA MARTÍNEZ',     href: 'Ana.html' },
      { img: 'IMAGES/PM_Diana.jpg',     video: 'VIDEOS/Diana.mp4',      name: 'DIANA XIMENA ÁNGEL',     href: 'Diana.html' },
      { img: 'IMAGES/TD_Jimmy.jpg',     video: 'VIDEOS/Jimmy.mp4',      name: 'JIMMY MARTÍNEZ',         href: 'Jimmy.html' },
      { img: 'IMAGES/SI_LauraC.png',    video: 'VIDEOS/LauraC.mp4',     name: 'LAURA CAROLINA BELTRAN', href: 'LauraC.html' },
      { img: 'IMAGES/PAIM_Nicolas.jpg', video: 'VIDEOS/Nicolas.mp4',    name: 'NICOLAS RODRIGUEZ',      href: 'Nicolas.html' },
      { img: 'IMAGES/TD_RONAL.jpg',     video: 'VIDEOS/Ronal.mp4',      name: 'RONAL SUESCA',           href: 'Ronal.html' },
      { img: 'IMAGES/PAIM_Andres.jpg',   video: 'VIDEOS/Andres.mp4',   name: 'ANDRÉS BRICEÑO',   href: 'Andres.html' },
  { img: 'IMAGES/PAIM_Juanita.jpg',  video: 'VIDEOS/Juanita.mp4',  name: 'JUANITA PALACIOS',  href: 'Juanita.html' },
  { img: 'IMAGES/PM_David.png',      video: 'VIDEOS/David.mp4',    name: 'DAVID MENDIETA',    href: 'David.html' },
  { img: 'IMAGES/PM_Laura.jpg',      video: 'VIDEOS/Laura.mp4',    name: 'LAURA ROBAYO',    href: 'Laura.html' },
  { img: 'IMAGES/SI_Camilo.jpg',     video: 'VIDEOS/Camilo.mp4',   name: 'CAMILO TRUJILLO',   href: 'Camilo.html' },
  { img: 'IMAGES/TD_Cristian.jpg',   video: 'VIDEOS/Cristian.mp4', name: 'CRISTIAN PEÑA', href: 'Cristian.html' },
  { img: 'IMAGES/TD_SofiaB.jpg',      video: 'VIDEOS/SofiaB.mp4',    name: 'SOFÍA BORJA',    href: 'Sofiab.html' }
    ];

    const gridStudents = document.getElementById('gridStudents');
    const filterBtns = document.querySelectorAll('.filters .btn');

    function categorizeByPrefix(filePath){
      if (!filePath) return 'otro';
      const lower = String(filePath).toLowerCase();
      const lastSlash = Math.max(lower.lastIndexOf('/'), lower.lastIndexOf('\\'));
      const basename = lastSlash >= 0 ? lower.slice(lastSlash + 1) : lower;
      for (const r of CATEGORY_RULES){
        if (basename.startsWith(r.prefix)) return r.key;
      }
      return 'otro';
    }

    function tintRGBFor(catKey){
      const root = getComputedStyle(document.documentElement);
      switch(catKey){
        case 'PAIM': return root.getPropertyValue('--cat-PAIM') || '0,218,220';
        case 'PM':   return root.getPropertyValue('--cat-PM')   || '0,213,102';
        case 'SI':   return root.getPropertyValue('--cat-SI')   || '177,178,177';
        case 'TD':   return root.getPropertyValue('--cat-TD')   || '245,183,30';
        default:     return root.getPropertyValue('--cat-otro') || '255,255,255';
      }
    }

    function makeTile(item){
      const category = categorizeByPrefix(item.img);
      const tint = tintRGBFor(category);

      const link = document.createElement('a');
      link.href = item.href || 'persona.html';
      link.style.display = 'block';
      link.style.textDecoration = 'none';
      link.setAttribute('aria-label', item.name || 'Detalle');
      link.title = item.name || '';

      const d = document.createElement('div');
      d.className = 'tile';
      d.dataset.category = category;
      d.style.setProperty('--tint-rgb', (tint||'').trim());

      const img = document.createElement('img');
      img.loading='lazy';
      img.decoding='async';
      img.src=item.img;
      img.alt=item.name||'';
      d.appendChild(img);

      if (item.video){
        const vid = document.createElement('video');
        vid.muted=true; vid.loop=true; vid.playsInline=true; vid.preload='none';
        vid.src=item.video; d.appendChild(vid);

        const start = () => { d.classList.add('playing'); vid.play().catch(()=>{}); };
        const stop  = () => { vid.pause(); vid.currentTime=0; d.classList.remove('playing'); };

        const canHover = window.matchMedia('(hover: hover)').matches;
        if (canHover){
          d.addEventListener('mouseenter', start);
          d.addEventListener('mouseleave', stop);
          link.addEventListener('focusin', start);
          link.addEventListener('focusout', stop);
        }
      }

      const cap = document.createElement('div');
      cap.className = 'caption';
      cap.textContent = item.name||'';
      d.appendChild(cap);

      link.appendChild(d);
      return link;
    }

    function renderAll(){
      const frag = document.createDocumentFragment();
      STUDENTS.forEach(stu => frag.appendChild(makeTile(stu)));
      gridStudents.appendChild(frag);
    }

    function applyFilter(filterKey){
      const anchors = gridStudents.querySelectorAll('a');
      anchors.forEach(a => {
        const tile = a.querySelector('.tile');
        if (!tile) return;
        if (filterKey==='todos' || tile.dataset.category === filterKey){
          a.classList.remove('hidden');
        } else {
          a.classList.add('hidden');
        }
      });
    }

    function setupFilters(){
      filterBtns.forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          e.preventDefault();
          filterBtns.forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          applyFilter(btn.dataset.filter);
        });
      });
    }

    renderAll();
    setupFilters();
    applyFilter('todos');

    (function setupTouchPlayback(){
      const canHover = window.matchMedia('(hover: hover)').matches;
      if(!canHover){
        gridStudents.addEventListener('click', (e)=>{
          const anchor = e.target.closest('a');
          const tile = e.target.closest('.tile');
          if(!tile || !anchor) return;
          const vid = tile.querySelector('video');

          if(!vid){ return; }

          e.preventDefault();

          if(!tile.classList.contains('playing')){
            tile.classList.add('playing');
            vid.play().catch(()=>{});
            anchor.dataset.armed = '1';
            clearTimeout(anchor._armT);
            anchor._armT = setTimeout(()=>{
              anchor.dataset.armed = '';
            }, 1500);
          }else{
            if(anchor.dataset.armed === '1'){
              tile.classList.remove('playing');
              vid.pause(); vid.currentTime=0;
              anchor.dataset.armed = '';
              clearTimeout(anchor._armT);
              window.location.href = anchor.href;
            }else{
              tile.classList.remove('playing');
              vid.pause(); vid.currentTime=0;
            }
          }
        }, {passive:false});
      }
    })();

    (function respectReducedMotion(){
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(prefersReduced){
        document.querySelectorAll('.tile video').forEach(v=>{
          v.removeAttribute('autoplay');
          v.pause();
        });
      }
    })();

    /* ===== MODAL LEYENDA ===== */

    const LEGEND_COLORS = {
      PAIM: "0,218,220",
      PM:   "0,213,102",
      SI:   "177,178,177",
      TD:   "245,183,30"
    };

    const legendModal   = document.getElementById("legendModal");
    const legendTitle   = document.getElementById("legendModalTitle");
    const legendBody    = document.getElementById("legendModalBody");
    const legendDialog  = legendModal.querySelector(".modal-dialog");

    function openLegendModal(code){
      let title = "";
      let text  = "";

      if (code === "PAIM"){
        title = "Procesamiento y análisis de la información multimedia (PAIM)";
        text  = "Esta área del programa desarrolla los fundamentos necesarios para que los graduados en Ingeniería en Multimedia puedan desempeñarse en actividades relacionadas con el análisis y el procesamiento de la información en diferentes sectores de aplicación. Así mismo, profundiza mediante componentes electivos, en áreas como la visión por computador, el procesamiento del lenguaje natural, sistemas de recomendación y aprendizaje semántico, entre otras. Desarrolla las líneas del procesamiento digital de señales multimedia y de inteligencia artificial, las cuales, al ser combinadas, ofrecen un potencial importante para el soporte a aplicaciones de diferentes sectores y de otras áreas de profundización.";
      } else if (code === "PM"){
        title = "Producción Multimedia (PM)";
        text  = "El área de Producción Multimedia tiene como objetivo el fundamentar a los estudiantes en los conceptos y técnicas computacionales para la producción de diversos contenidos, los cuales son diseñados, producidos e implementados en diversos productos multimedia y de base tecnológica. ";
      } else if (code === "SI"){
        title = "Sistemas Interactivos (SI)";
        text  = "El área aborda aspectos relacionados con el diseño, evaluación y desarrollo de sistemas interactivos, los cuales deben estar orientados a las necesidades de los usuarios y adaptadas a su contexto. De esa forma se abordan conceptos teóricos y prácticos del  área de la interacción humano computador, que permiten al profesional proponer soluciones creativas enfocadas a cumplir con las expectativas en un marco de viabilidad y factibilidad. ";
      } else if (code === "TD"){
        title = "Transformación Digital (TD)";
        text  = "El área de Transformación Digital está enfocada en el aprendizaje de conceptos fundamentales para diseñar, estructurar y desarrollar productos y soluciones a las organizaciones de acuerdo con las tendencias de emprendimiento e innovación, aplicando tecnologías digitales. ";
      }
      if (!title) return;
      legendTitle.textContent = title;
      legendBody.textContent  = text;
      const rgb = LEGEND_COLORS[code];
      if (rgb){
        legendDialog.style.background = "rgb(" + rgb + ")";
        legendDialog.style.borderTop  = "6px solid rgb(" + rgb + ")";
      } else {
        legendDialog.style.background = "#ffffff";
        legendDialog.style.borderTop  = "6px solid transparent";
      }

      legendModal.classList.add("show");
      legendModal.setAttribute("aria-hidden","false");
    }

    function closeLegendModal(){
      legendModal.classList.remove("show");
      legendModal.setAttribute("aria-hidden","true");
    }

    legendModal.addEventListener("click", (e)=>{
      if (e.target === legendModal){
        closeLegendModal();
      }
    });

    document.addEventListener("keydown", (e)=>{
      if (e.key === "Escape" && legendModal.classList.contains("show")){
        closeLegendModal();
      }
    });
  </script>
</body>
</html>
